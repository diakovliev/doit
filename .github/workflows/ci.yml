name: doit CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./... -count=1

      - name: Vet
        run: go vet ./...

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(find . -name '*.go' -type f))"

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64

      - name: Security scan
        shell: bash
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec ./...
